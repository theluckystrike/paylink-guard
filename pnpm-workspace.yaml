packages:
  - "."

allowBuilds:
  bigint-buffer: false
  bufferutil: false
  esbuild: true
  utf-8-validate: false

# Patched transitive versions (pnpm audit 2026-10-17). The plugin never opens a WebSocket or JSON-RPC client;
# these pins only keep the audit clean. bigint-buffer has no patched release; its native binding is not built.
overrides:
  ws@>=8.0.0 <8.21.0: 8.22.0
  uuid@<11.1.1: 11.1.1
  stream-json@<3.6.0: 3.7.0
